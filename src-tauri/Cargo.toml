[package]
name = "mdsh"
# The application version comes from ../package.json through tauri.conf.json.
version = "0.0.0"
description = "Local-first offline WYSIWYG markdown editor"
authors = ["Thomas Crouzet"]
license = "MIT"
repository = "https://github.com/ThomasCrouzet/mdsh"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mdsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
native-smoke = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "=0.18.5"

[patch.crates-io]
glib = { path = "vendor/glib" }
