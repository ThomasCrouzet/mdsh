version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Open one weekly pull request for patch and minor updates, except packages
    # that require dedicated review because of prior compatibility breaks.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
        # Milkdown has a history of breaking minor releases and needs manual review.
        exclude-patterns:
          - '@milkdown/*'
    # Major upgrades remain visible as separate pull requests for manual review.
    # A previous major-version ignore hid them entirely.
    ignore:
      # js-yaml 5 supprime l'export DEFAULT_SCHEMA utilisé dans frontmatter.ts -
      # pas de migration prévue tant que le parsing fail-soft actuel
      # (js-yaml 4.x) suffit.
      - dependency-name: 'js-yaml'
        update-types:
          - 'version-update:semver-major'
      # Current stack: Vitest 4, ESLint 10, TypeScript 6, jsdom 26.
      # Ignore the next majors until a dedicated migration PR.
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitest/coverage-v8'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'jsdom'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
