name: gitleaks

# Détection de secrets sur tout l'historique (mode git), via l'image Docker
# officielle épinglée : même convention que le job "secrets" de CREAJ, sans
# action tierce à version mutable. Les faux positifs ciblés se neutralisent
# dans le fichier .gitleaks.toml à la racine du dépôt.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: gitleaks (image épinglée)
        run: |
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1
