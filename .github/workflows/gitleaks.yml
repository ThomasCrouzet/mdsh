name: gitleaks

# Détection de secrets sur tout l'historique (mode git), via l'image Docker
# officielle épinglée : même convention que le job "secrets" de CREAJ, sans
# action tierce à version mutable. Les faux positifs ciblés se neutralisent
# dans le fichier .gitleaks.toml à la racine du dépôt.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (image épinglée)
        run: |
          # ghcr.io/gitleaks/gitleaks:v8.30.1
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1
