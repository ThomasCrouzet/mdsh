name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # Configuration externalisée pour pouvoir évoluer sans toucher au workflow.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
