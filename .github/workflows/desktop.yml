name: Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Source release tag used for the Desktop Beta
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Source release tag used for the Desktop Beta
        required: true
        type: string
      validation_run_id:
        description: Successful Desktop push run reused for this release
        required: false
        default: ''
        type: string
      validated_sha:
        description: Commit SHA validated by the reused Desktop push run
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ inputs.release_tag || '' }}
  VALIDATED_SHA: ${{ inputs.validated_sha || '' }}
  VALIDATION_RUN_ID: ${{ inputs.validation_run_id || '' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.filter.outputs.required }}
    steps:
      - name: Checkout change range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Desktop changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$RELEASE_TAG" ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'pull_request' ]; then
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/desktop-changes.mjs >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ] && [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'push' ]; then
            git diff --name-only -z "$BEFORE_SHA" "$HEAD_SHA" | node scripts/desktop-changes.mjs >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  resolve-source:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Resolve and validate source identity
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          const validatedSha = process.env.VALIDATED_SHA;
          const validationRunId = process.env.VALIDATION_RUN_ID;
          if (Boolean(validatedSha) !== Boolean(validationRunId)) {
            throw new Error('validated_sha and validation_run_id must be supplied together');
          }
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (tag && tag !== `v${version}`) throw new Error('Source tag/version mismatch');
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (tag) {
            if (!/^v\d+\.\d+\.\d+(?:-[\w.]+)?$/.test(tag)) throw new Error('Invalid release tag');
            execFileSync('git', ['show-ref', '--verify', '--quiet', `refs/tags/${tag}`]);
            const tagSha = execFileSync('git', ['rev-parse', `${tag}^{commit}`], { encoding: 'utf8' }).trim();
            if (tagSha !== sha) throw new Error('Release tag does not identify checked out source');
            if (process.env.GITHUB_SHA !== sha) throw new Error('Run the release workflow from the source tag so provenance identifies the same commit');
          }
          if (validatedSha) {
            if (validatedSha !== sha) throw new Error('Reused Desktop validation has a different source SHA');
            const run = JSON.parse(execFileSync('gh', [
              'api',
              `repos/${process.env.GH_REPO}/actions/runs/${validationRunId}`
            ], { encoding: 'utf8' }));
            if (run.head_sha !== sha || run.event !== 'push' || run.conclusion !== 'success') {
              throw new Error('Reused Desktop validation is not a successful push run for this source SHA');
            }
            if (run.path !== '.github/workflows/desktop.yml') {
              throw new Error('Reused validation did not run the Desktop workflow');
            }
            const jobs = JSON.parse(execFileSync('gh', [
              'api',
              `repos/${process.env.GH_REPO}/actions/runs/${validationRunId}/jobs?per_page=100`
            ], { encoding: 'utf8' })).jobs;
            for (const prefix of ['validate-desktop (', 'native-smoke (']) {
              const matching = jobs.filter((job) => job.name.startsWith(prefix));
              if (matching.length !== 4 || matching.some((job) => job.conclusion !== 'success')) {
                throw new Error(`Reused validation does not contain four successful ${prefix} jobs`);
              }
            }
            if (!jobs.some((job) => job.name === 'desktop-validation' && job.conclusion === 'success')) {
              throw new Error('Reused validation has no successful desktop-validation gate');
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`);
          JS

  validate-desktop:
    needs: resolve-source
    if: inputs.validated_sha == ''
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify GLib source and security backport
        run: node scripts/vendor-glib.mjs --check
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Test optimized GLib regression on Linux
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --test glib_variant_regression
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Cargo.lock including unsound dependencies
        if: runner.os == 'Linux'
        run: cargo audit --file src-tauri/Cargo.lock --deny unsound

  native-smoke:
    needs: [resolve-source, validate-desktop]
    if: inputs.validated_sha == '' && needs.validate-desktop.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux WebView and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-daemon dbus-bin
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build isolated native test app
        run: npm run tauri -- build --debug --features native-smoke --no-bundle --config src-tauri/tauri.smoke.conf.json
        env:
          BASE_PATH: ''
      - name: Exercise actual Linux WebView
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/native-smoke.mjs
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: Exercise actual native WebView
        if: runner.os != 'Linux'
        run: node scripts/native-smoke.mjs
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-smoke-${{ matrix.platform }}
          path: native-test-results/
          retention-days: 14

  desktop-validation:
    name: desktop-validation
    needs: [changes, resolve-source, validate-desktop, native-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check validation result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATION_REQUIRED: ${{ needs.changes.outputs.required }}
          RESOLVE_RESULT: ${{ needs.resolve-source.result }}
          VALIDATE_RESULT: ${{ needs.validate-desktop.result }}
          SMOKE_RESULT: ${{ needs.native-smoke.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo 'Desktop change detection failed.' >&2
            exit 1
          fi
          if [ "$VALIDATION_REQUIRED" != 'true' ]; then
            echo 'Desktop validation is not required for these paths.'
          elif [ -n "$VALIDATED_SHA" ]; then
            test "$RESOLVE_RESULT" = 'success'
            test "$VALIDATE_RESULT" = 'skipped'
            test "$SMOKE_RESULT" = 'skipped'
            echo "Reused Desktop validation run $VALIDATION_RUN_ID for $VALIDATED_SHA."
          else
            test "$RESOLVE_RESULT" = 'success'
            test "$VALIDATE_RESULT" = 'success'
            test "$SMOKE_RESULT" = 'success'
          fi

  build-desktop:
    needs: [resolve-source, desktop-validation]
    if: ${{ !cancelled() && inputs.release_tag != '' && needs.resolve-source.result == 'success' && needs.desktop-validation.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-2022
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
          targets: ${{ runner.os == 'macOS' && (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Build workflow artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          BASE_PATH: ''
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  build-sbom:
    needs: [resolve-source, desktop-validation]
    if: ${{ !cancelled() && inputs.release_tag != '' && needs.resolve-source.result == 'success' && needs.desktop-validation.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate npm SBOM
        run: npm run sbom:npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.1
      - name: Install Cargo SBOM generator
        run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate Cargo SBOM
        run: cargo cyclonedx --manifest-path src-tauri/Cargo.toml --target all --format json --spec-version 1.5 --override-filename sbom-cargo
      - name: Collect Cargo SBOM
        run: cp src-tauri/sbom-cargo.json sbom-cargo.cdx.json
      - name: Record GLib security backport in Cargo SBOM
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: node scripts/annotate-cargo-sbom.mjs sbom-cargo.cdx.json patches/glib/variant-str-iter.patch
      - name: Record source identity
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          writeFileSync('desktop-source.json', JSON.stringify({ sha: process.env.SOURCE_SHA, tag: process.env.RELEASE_TAG, version }, null, 2));
          JS
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-sboms
          path: |
            sbom-*.cdx.json
            desktop-source.json
          if-no-files-found: error

  publish-desktop-beta:
    needs: [resolve-source, build-desktop, build-sbom]
    if: ${{ !cancelled() && inputs.release_tag != '' && needs.resolve-source.result == 'success' && needs.build-desktop.result == 'success' && needs.build-sbom.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded-assets
          merge-multiple: false
      - name: Select installers and verify source before checksums
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: node scripts/collect-desktop-assets.mjs downloaded-assets release-assets
      - name: Verify checksums from the release directory
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish distinct Desktop Beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_TAG: ${{ env.RELEASE_TAG }}
          DESKTOP_TAG: desktop-${{ env.RELEASE_TAG }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          tag_sha=$(gh api "repos/$GH_REPO/commits/$SOURCE_TAG" --jq '.sha')
          gh api "repos/$GH_REPO/git/ref/tags/$SOURCE_TAG" >/dev/null
          test "$tag_sha" = "$SOURCE_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/$DESKTOP_TAG" >/dev/null 2>&1; then
            desktop_tag_sha=$(gh api "repos/$GH_REPO/commits/$DESKTOP_TAG" --jq '.sha')
            test "$desktop_tag_sha" = "$SOURCE_SHA"
          fi
          if gh release view "$DESKTOP_TAG" >/dev/null 2>&1; then
            gh release view "$DESKTOP_TAG" --json targetCommitish,assets,isPrerelease,tagName > existing-release.json
            node --input-type=module <<'JS'
          import { readFileSync, readdirSync } from 'node:fs';
          const release = JSON.parse(readFileSync('existing-release.json', 'utf8'));
          if (release.tagName !== process.env.DESKTOP_TAG || release.isPrerelease !== true) {
            throw new Error('The existing Desktop release does not match the expected beta channel');
          }
          const expected = new Set(readdirSync('release-assets'));
          const unexpected = release.assets.map(({ name }) => name).filter(name => !expected.has(name));
          if (unexpected.length) throw new Error(`Unexpected artifacts in the existing release: ${unexpected.join(', ')}`);
          JS
            release_target=$(jq -r '.targetCommitish' existing-release.json)
            release_target_sha=$(gh api "repos/$GH_REPO/commits/$release_target" --jq '.sha')
            test "$release_target_sha" = "$SOURCE_SHA"
          else
            gh release create "$DESKTOP_TAG" \
              --target "$SOURCE_SHA" \
              --title "mdsh editor Desktop Beta $SOURCE_TAG" \
              --notes "Desktop Beta installers are not signed. macOS Gatekeeper and Windows SmartScreen can show a warning. Check SHA256SUMS, the SBOMs, and the attestation before installation." \
              --prerelease
          fi
          desktop_tag_sha=$(gh api "repos/$GH_REPO/commits/$DESKTOP_TAG" --jq '.sha')
          test "$desktop_tag_sha" = "$SOURCE_SHA"
          find release-assets -type f -print0 | xargs -0 -n 1 gh release upload "$DESKTOP_TAG" --clobber
