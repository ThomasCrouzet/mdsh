name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Scope par ref : un groupe global "pages" (sans suffixe) fait que CHAQUE push
# (main + toutes les PR confondues) rejoint la meme file d'attente - avec
# cancel-in-progress=false, seul le dernier run ARRIVE dans la file survit,
# tous les runs plus anciens (deploy main compris) sont annules avant meme de
# demarrer un job. Suffixer par ${{ github.ref }} isole chaque branche/PR dans
# sa propre file.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Opt-in Node.js 24 pour les actions JS (actions/cache@v4 tourne sinon sur
# Node 20, déprécié par GitHub en juin 2026). Anticipe la transition.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache `node_modules` extrait. `setup-node@v5 cache: npm`
      # couvre déjà le tarball cache (`~/.npm`), mais l'extract reste à faire
      # à chaque job (~10-15s × 4 jobs). Cache direct de `node_modules` =
      # restore ~2s sur cache hit.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # §J2 - Gate sécurité bloquant sur tout l'arbre : les dépendances de build
      # s'exécutent en CI et doivent être traitées au même niveau que le runtime.
      - name: Audit complet des dépendances
        run: npm audit --audit-level=high

      - name: Sync SvelteKit
        run: npm run prepare

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Third-party notices
        run: npm run notices:check

      - name: Tests et couverture
        run: npm run test:coverage

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache `node_modules` extrait. `setup-node@v5 cache: npm`
      # couvre déjà le tarball cache (`~/.npm`), mais l'extract reste à faire
      # à chaque job (~10-15s × 4 jobs). Cache direct de `node_modules` =
      # restore ~2s sur cache hit.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      # Cache des binaires navigateurs Playwright (~/.cache/ms-playwright) :
      # évite de re-télécharger chromium + webkit (~150 MB) à chaque run. Clé
      # liée au lockfile (la version @playwright/test y est figée). Sur cache
      # hit on n'installe que les dépendances système (apt), pas les binaires.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (+ deps système)
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright deps système (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # Visual snapshots: deliberately not a CI gate (local-only policy).
      # Docker Playwright baselines diverge from ubuntu-latest font rendering
      # (see ROADMAP.md + CONTRIBUTING.md). Baselines stay versioned for local
      # comparison; do not remove --ignore-snapshots without regenerating on CI.
      - name: E2E tests (sans snapshots visuels)
        run: npx playwright test --ignore-snapshots --grep-invert "Snapshots visuels"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      # Build en parallèle avec BASE_PATH vide (cas domaine custom) et
      # /mdsh (cas GitHub Pages sous-chemin). Seule la variante /mdsh remonte
      # un artifact pour le deploy ; la variante vide sert à détecter les
      # régressions sur les chemins absolus oubliés.
      fail-fast: false
      matrix:
        include:
          - base_path: /${{ github.event.repository.name }}
            upload: true
          - base_path: ''
            upload: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache `node_modules` extrait. `setup-node@v5 cache: npm`
      # couvre déjà le tarball cache (`~/.npm`), mais l'extract reste à faire
      # à chaque job (~10-15s × 4 jobs). Cache direct de `node_modules` =
      # restore ~2s sur cache hit.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.base_path }}

      - name: Check bundle size budget
        if: matrix.upload == true
        run: npm run size

      - name: Upload artifact
        if: matrix.upload == true && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/

  lighthouse:
    # Lighthouse is a release gate on both pull requests and main.
    # The assertions and budgets are defined in the repository config files.
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache `node_modules` extrait. `setup-node@v5 cache: npm`
      # couvre déjà le tarball cache (`~/.npm`), mais l'extract reste à faire
      # à chaque job (~10-15s × 4 jobs). Cache direct de `node_modules` =
      # restore ~2s sur cache hit.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Build avec BASE_PATH vide : `staticDistDir` sert `./build` depuis la
      # racine, donc les paths absolus du HTML doivent pointer sur `/...` et
      # pas `/mdsh/...`. C'est aussi la config testée par §9.2.1 (custom
      # domain) - ce job en couvre incidemment la régression.
      - name: Build (BASE_PATH vide)
        run: npm run build
        env:
          BASE_PATH: ''

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.github/lighthouserc.json
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  deploy:
    # Publishing requires the build, browser suite, and Lighthouse audit.
    needs: [build, e2e, lighthouse]
    # Skip le deploy sur les PR - on ne veut pas publier du code non mergé.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Moindre privilège : seul ce job a besoin de publier sur Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
