name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Use one concurrency group per ref. A global pages group combines main and all pull requests.
# Cancel obsolete pull request runs. Let a main deployment finish once it starts.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Use Node.js 24 for JavaScript actions before the required transition.
# actions/cache@v4 otherwise uses Node 20, which GitHub deprecated in June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # §J2 - Check the full dependency tree. Fail on security findings.
      # Build dependencies execute in CI and need the same checks as runtime dependencies.
      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Third-party notices
        run: npm run notices:check

      - name: Tests and coverage
        run: npm run test:coverage

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Cache Playwright browsers in ~/.cache/ms-playwright to avoid repeated downloads (about 150 MB for Chromium and WebKit).
      # Use the lockfile in the cache key because it fixes the @playwright/test version.
      # On a cache hit, install only system dependencies through apt.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (+ system dependencies)
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies (cache hit)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # Visual snapshots: deliberately not a CI gate (local-only policy).
      # Docker Playwright baselines diverge from ubuntu-latest font rendering
      # (see ROADMAP.md + CONTRIBUTING.md). Baselines stay versioned for local
      # comparison; do not remove --ignore-snapshots without regenerating on CI.
      - name: E2E tests (without visual snapshots)
        run: npx playwright test --ignore-snapshots --grep-invert "Snapshots visuels"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Build in parallel with an empty BASE_PATH for custom domains and /mdsh for GitHub Pages.
      # Only the /mdsh variant supplies the deployment artifact.
      # The empty variant detects incorrect absolute paths.
      fail-fast: false
      matrix:
        include:
          - base_path: /${{ github.event.repository.name }}
            upload: true
          - base_path: ''
            upload: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ matrix.base_path }}

      - name: Check bundle size budget
        if: matrix.upload == true
        run: npm run size

      - name: Upload artifact
        if: matrix.upload == true && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/

  lighthouse:
    # Lighthouse is a release gate on both pull requests and main.
    # The assertions and budgets are defined in the repository config files.
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # §A4.1 - Cache extracted node_modules. setup-node@v5 cache: npm covers ~/.npm tarballs only.
      # Extraction takes about 10-15 seconds per job across four jobs.
      # A node_modules cache hit restores files in about 2 seconds.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Build with an empty BASE_PATH. staticDistDir serves ./build from the root.
      # Absolute HTML paths must start with /, not /mdsh/.
      # This also checks the custom domain case in §9.2.1.
      - name: Build (empty BASE_PATH)
        run: npm run build
        env:
          BASE_PATH: ''

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.github/lighthouserc.json
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  deploy:
    # Publishing requires the build, browser suite, and Lighthouse audit.
    needs: [build, e2e, lighthouse]
    # Do not deploy pull requests. Publish code only after merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job needs permission to publish to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
