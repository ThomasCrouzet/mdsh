name: Feature proposal
description: Suggest a new feature or improvement
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Check that the proposal follows the project principles:
        a small interface, full offline support, a dark theme by default, and no telemetry.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed interface, shortcut, and location.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Did you consider other approaches? Why is this one the best?

  - type: checkboxes
    id: principles
    attributes:
      label: Compatibility with project principles
      description: Check everything that applies
      options:
        - label: Works 100% offline (no network request)
        - label: No telemetry or tracking
        - label: Respects dark-first and accessibility (WCAG AA)
        - label: Keeps the initial bundle small (load on demand where possible)

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
