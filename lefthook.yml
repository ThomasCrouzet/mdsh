# Hooks Git locaux - installés via `npm run prepare` (qui appelle lefthook install).
# Contributeurs externes : exécution opt-in, aucun blocage silencieux.

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,js,svelte,css,md,json,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,js,svelte}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true

# Pre-push : vérifs plus lourdes (évite les PR rouges pour des erreurs TS
# ou des tests cassés qu'un simple lint n'aurait pas attrapés).
pre-push:
  parallel: false
  commands:
    typecheck:
      run: npm run check
    tests:
      run: npm test
