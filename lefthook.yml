# Install local Git hooks with `npm run prepare`, which calls lefthook install.
# External contributors must opt in. Do not silently block their work.

pre-commit:
  parallel: true
  commands:
    repository-policy:
      run: 'policy_check="${REPOSITORY_POLICY_CHECK:-$HOME/.config/git/repository-policy/policy-check.sh}"; [ ! -x "$policy_check" ] || "$policy_check" staged'
    prettier:
      glob: '*.{ts,js,svelte,css,md,json,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,js,svelte}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true

# Before push, check types and tests.
# These checks catch failures that lint alone cannot detect.
pre-push:
  parallel: false
  commands:
    repository-policy:
      run: 'policy_check="${REPOSITORY_POLICY_CHECK:-$HOME/.config/git/repository-policy/policy-check.sh}"; [ ! -x "$policy_check" ] || "$policy_check" push'
    typecheck:
      run: npm run check
    tests:
      run: npm test
