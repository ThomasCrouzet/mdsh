<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fond conforme au theme color du projet -->
  <rect width="1200" height="630" fill="#14161a"/>

  <!-- Liseré accent en haut, écho subtil au focus indicator de la sidebar -->
  <rect x="0" y="0" width="1200" height="4" fill="#7ee0b8"/>

  <!-- Titre principal "$ mdsh" en mono accent -->
  <text x="600" y="280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="160" font-weight="700" fill="#7ee0b8" text-anchor="middle" dominant-baseline="middle">$ mdsh</text>

  <!-- Sous-titre principal -->
  <text x="600" y="395" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="500" fill="#9aa3ad" text-anchor="middle">Éditeur markdown WYSIWYG minimaliste</text>

  <!-- Tagline secondaire -->
  <text x="600" y="450" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" fill="#5e6770" text-anchor="middle">dark · PWA · 100 % offline</text>

  <!-- Footer URL repo -->
  <text x="600" y="565" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#5e6770" text-anchor="middle">github.com/ThomasCrouzet/mdsh</text>
</svg>
